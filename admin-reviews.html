<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Review moderation | Kailashpati Tour &amp; Travels</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" referrerpolicy="no-referrer">
  <style>
    body{min-height:100vh;background:#f3f5f8;color:#17263b}.admin-shell{width:min(1100px,calc(100% - 32px));margin:36px auto}.admin-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.admin-head h1{margin:0;font-size:clamp(1.5rem,4vw,2rem)}.admin-card{padding:24px;border:1px solid #e1e6ec;border-radius:16px;background:#fff;box-shadow:0 8px 26px rgba(20,34,56,.07)}.admin-login{max-width:440px;margin:10vh auto}.admin-form{display:grid;gap:14px}.admin-form label{display:grid;gap:7px;font-weight:700}.admin-form input{padding:12px;border:1px solid #cbd4df;border-radius:9px;font:inherit}.admin-msg{min-height:1.5em;color:#a22}.admin-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.admin-count{padding:18px;border-radius:12px;background:#f3f5f8}.admin-count strong{display:block;font-size:1.6rem}.admin-count span{color:#647184;font-size:.85rem}.admin-list{display:grid;gap:14px}.admin-review{border:1px solid #e2e7ed;border-radius:12px;padding:17px}.admin-review-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.admin-review h3{margin:0 0 5px}.admin-review p{white-space:pre-wrap;line-height:1.55}.admin-review-meta{color:#69778a;font-size:.84rem}.admin-stars{color:#ef9709}.admin-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.admin-actions button{padding:8px 12px;border:0;border-radius:8px;background:#e9edf2;color:#17263b;font-weight:700;cursor:pointer}.admin-actions .approve{background:#e5f5e9;color:#1e6532}.admin-actions .reject{background:#fff2df;color:#8b5100}.admin-actions .delete{background:#fde9e9;color:#9c2525}.admin-status{padding:4px 8px;border-radius:99px;background:#fff1d9;color:#7b4b00;font-size:.72rem;font-weight:800;text-transform:uppercase}.admin-status.approved{background:#e5f5e9;color:#1e6532}.admin-status.rejected{background:#fde9e9;color:#9c2525}.admin-empty{padding:30px;text-align:center;color:#647184}.admin-toolbar{display:flex;justify-content:flex-end;margin-bottom:14px}@media(max-width:600px){.admin-shell{margin:20px auto}.admin-counts{grid-template-columns:repeat(2,1fr)}.admin-card{padding:17px}.admin-head{align-items:flex-start}.admin-review-head{flex-direction:column}}
  </style>
</head>
<body>
  <main class="admin-shell">
    <section class="admin-card admin-login" id="login-panel">
      <h1>Review moderation</h1>
      <p>Sign in to review customer submissions. Approval actions are restricted to administrators.</p>
      <form class="admin-form" id="admin-login-form">
        <label>Admin password<input type="password" name="password" autocomplete="current-password" minlength="16" required></label>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <p class="admin-msg" id="login-message" role="status"></p>
      </form>
    </section>
    <section id="dashboard-panel" hidden>
      <div class="admin-head"><h1>Customer review moderation</h1><button class="btn btn-outline" id="admin-logout" type="button">Sign out</button></div>
      <div class="admin-counts" id="admin-counts"></div>
      <div class="admin-toolbar"><button class="btn btn-outline" id="admin-refresh" type="button">Refresh</button></div>
      <div class="admin-list" id="admin-list" aria-live="polite"></div>
    </section>
  </main>
  <script src="reviews-admin.js" defer></script>
</body>
</html>
